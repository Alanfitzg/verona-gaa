<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Tocatì — Festival dei Giochi in Strada, Verona">
  <title>Tocatì — Festival of Street Games, Verona</title>
  <defs>
    <path id="arc-top" d="M 90 240 A 150 150 0 0 1 390 240" fill="none"/>
    <path id="arc-bot" d="M 96 240 A 144 144 0 0 0 384 240" fill="none"/>
    <linearGradient id="top-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a93a"/>
      <stop offset="1" stop-color="#e2533b"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="240" cy="240" r="228" fill="#fbf3e4"/>
  <circle cx="240" cy="240" r="228" fill="none" stroke="#e2533b" stroke-width="10"/>
  <circle cx="240" cy="240" r="196" fill="none" stroke="#1f7a70" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Curved lettering -->
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" fill="#1f7a70"
        font-size="20" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#arc-top" startOffset="50%">FESTIVAL DEI GIOCHI IN STRADA</textPath>
  </text>
  <text font-family="Poppins, Arial, sans-serif" font-weight="700" fill="#c8442f"
        font-size="24" letter-spacing="10" text-anchor="middle">
    <textPath href="#arc-bot" startOffset="50%">◆ VERONA ◆</textPath>
  </text>

  <!-- Spinning top (trottola) — a classic street game -->
  <g transform="translate(240 196)">
    <ellipse cx="0" cy="86" rx="52" ry="12" fill="#e2533b" opacity="0.18"/>
    <path d="M -52 -34 Q 0 -54 52 -34 L 8 58 Q 0 70 -8 58 Z" fill="url(#top-grad)"/>
    <path d="M -52 -34 Q 0 -54 52 -34 L 40 -8 Q 0 -26 -40 -8 Z" fill="#c8442f" opacity="0.55"/>
    <rect x="-7" y="-70" width="14" height="26" rx="7" fill="#1f7a70"/>
    <circle cx="0" cy="70" r="7" fill="#1f7a70"/>
    <!-- motion marks -->
    <path d="M -76 -20 q -14 8 -10 26" fill="none" stroke="#1f7a70" stroke-width="6" stroke-linecap="round"/>
    <path d="M 76 -20 q 14 8 10 26" fill="none" stroke="#1f7a70" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="240" y="322" text-anchor="middle" font-family="Poppins, Arial, sans-serif"
        font-weight="800" font-size="86" letter-spacing="-2" fill="#c8442f">Tocatì</text>
</svg>
